{% extends "base.html" %}{% block title %}Edit Job — JobMatch{% endblock %}{% block content %}<div class="container"><div class="page-title"><span class="eyebrow">EDIT JOB</span><h1>{{job.job_title}}</h1></div><div class="card form-card"><form method="post"><div class="grid2"><div>
<div class="field"><label>Job Title <span class="required-star">*</span></label><select name="job_title" required>{% for x in JOB_TITLES %}<option {% if x==job.job_title %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Company</label><input name="company" value="{{job.company or ''}}"></div>
<div class="field"><label>Required Skills <span class="required-star">*</span></label><details class="skill-dropdown"><summary>Select Required Skills <span class="skill-arrow">▾</span></summary><div class="skill-options">{% for item in SKILLS %}<label class="skill-choice"><input type="checkbox" name="required_skills" value="{{ item }}" {% if item in (job.required_skills or "").split(", ") %}checked{% endif %}><span>{{ item }}</span></label>{% endfor %}</div></details><small class="skill-help">Select as many skills as you need. Click the arrow to close.</small></div>
<div class="field"><label>Education <span class="required-star">*</span></label><select name="education" required><option value="">Select</option>{% for x in EDUCATION_LEVELS %}<option {% if x==job.education %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Degree <span class="required-star">*</span></label><select name="degree" required><option value="">Select</option>{% for x in DEGREES %}<option {% if x==job.degree %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div></div><div>
<div class="field"><label>Minimum Experience <span class="required-star">*</span></label><select name="min_experience">{% for x in EXPERIENCE_LEVELS %}<option value="{{x}}" {% if x==job.min_experience|int %}selected{% endif %}>{{x}} years</option>{% endfor %}</select></div><div class="field"><label>Salary Range <span class="required-star">*</span></label><select name="salary_range" required><option value="">Select</option>{% for x in SALARY_RANGES %}<option {% if x==job.salary_range %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Location</label><input name="location" value="{{job.location or ''}}"></div><div class="field"><label>Job Type</label><select name="job_type">{% for x in JOB_TYPES %}<option {% if x==job.job_type %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Description</label><textarea name="description">{{job.description or ''}}</textarea></div></div></div><div class="form-actions"><button class="btn btn-primary">Update Job</button><a class="btn" href="{{url_for('jobs')}}">Cancel</a></div></form></div></div>{% endblock %}
